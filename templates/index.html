<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Yak Auto-Immo | Votre Vitrine Auto & Immo</title>
    <meta property="og:title" content="Yak Auto-Immo">
    <meta property="og:description" content="Découvrez nos arrivages : Voitures, Vêtements et Parcelles au meilleur prix.">
    <meta name="theme-color" content="#d32f2f">

    <style>
        :root {
            --primary: #d32f2f; /* Rouge auto */
            --dark: #1a1a1a;    /* Noir pro */
            --light: #f8f9fa;
            --success: #25D366; /* Vert WhatsApp */
        }

        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            margin: 0; 
            background-color: var(--light); 
            color: var(--dark); 
        }

        header { 
            background: linear-gradient(135deg, var(--dark) 0%, #444 100%);
            color: white; 
            text-align: center; 
            padding: 40px 20px;
            border-bottom: 5px solid var(--primary);
        }

        header h1 { margin: 0; font-size: 2.5em; text-transform: uppercase; letter-spacing: 2px; }
        header p { opacity: 0.8; font-style: italic; }

        .container { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 25px; 
            padding: 30px 15px;
            max-width: 1200px;
            margin: auto;
        }

        .card { 
            background: white; 
            border-radius: 15px; 
            overflow: hidden; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s;
            border: 1px solid #ddd;
        }

        .card:hover { transform: translateY(-5px); }

        .card img { 
            width: 100%; 
            height: 250px; 
            object-fit: cover; 
            border-bottom: 3px solid var(--primary);
        }

        .card-info { padding: 20px; text-align: center; }
        
        .card-info h3 { margin: 10px 0; color: var(--dark); font-size: 1.4em; }

        .price-tag { 
            background: var(--primary);
            color: white;
            display: inline-block;
            padding: 5px 15px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.2em;
            margin-bottom: 15px;
        }

        .btn-wa { 
            background-color: var(--success); 
            color: white; 
            text-decoration: none; 
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px; 
            border-radius: 8px; 
            font-weight: bold;
            gap: 10px;
            transition: background 0.3s;
        }

        .btn-wa:hover { background-color: #128C7E; }

        footer { text-align: center; padding: 20px; color: #888; font-size: 0.9em; }
    </style>
</head>
<body>

    <header>
        <h1>🚗 Yak Auto-Immo 🏠</h1>
        <p>Qualité • Fiabilité • Rapidité</p>
    </header>

    <div class="container">
        {% for a in annonces %}
        <div class="card">
            <img src="{{ url_for('static', filename='uploads/' + a.image) }}" alt="{{ a.titre }}">
            <div class="card-info">
                <div class="price-tag">{{ a.prix }} FCFA</div>
                <h3>{{ a.titre }}</h3>
                <a href="https://wa.me/22670953747?text=Bonjour Yak Auto-Immo, je suis intéressé par l'article : {{ a.titre }}" class="btn-wa">
                    <span>💬</span> Discuter sur WhatsApp
                </a>
            </div>
        </div>
        {% else %}
        <div style="text-align: center; grid-column: 1/-1; padding: 100px 20px; background: white; border-radius: 15px;">
            <p style="font-size: 1.2em; color: #666;">Bienvenue chez Yak Auto-Immo.<br>Nos nouvelles offres arrivent très bientôt !</p>
        </div>
        {% endfor %}
    </div>

    <footer>
        &copy; 2026 Yak Auto-Immo - Tous droits réservés
    </footer>

</body>
    </html>
