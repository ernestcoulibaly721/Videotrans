<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yak Auto-Immo | Vitrine</title>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f4f4f4; color: #333; }
        header { background: #000; color: #fff; text-align: center; padding: 20px; }
        .container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; padding: 15px; }
        .card { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 250px; object-fit: cover; }
        .card-info { padding: 15px; }
        .price { color: #d32f2f; font-size: 1.3em; font-weight: bold; }
        .btn-wa { background: #25D366; color: #fff; text-decoration: none; display: block; text-align: center; padding: 12px; border-radius: 5px; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <h1>🚗 Yak Auto-Immo 🏠</h1>
        <p>Vêtements, Véhicules et Parcelles</p>
    </header>

    <div class="container">
        {% for a in annonces %}
        <div class="card">
            <img src="{{ url_for('static', filename='uploads/' + a.image) }}" alt="Photo">
            <div class="card-info">
                <h3>{{ a.titre }}</h3>
                <p class="price">{{ a.prix }} FCFA</p>
                <a href="https://wa.me/22670953747?text=Bonjour, je suis intéressé par : {{ a.titre }}" class="btn-wa">Discuter sur WhatsApp</a>
            </div>
        </div>
        {% else %}
        <p style="text-align: center; grid-column: 1/-1; padding: 50px;">Aucun article disponible. Allez sur /admin pour en ajouter !</p>
        {% endfor %}
    </div>
</body>
</html>
